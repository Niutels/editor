name: Publish Landrush site

on:
  push:
    branches:
      - pascal-landrush
  workflow_dispatch:

concurrency:
  group: publish-landrush-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Niutels/editor'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout editor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install editor dependencies
        run: bun install --frozen-lockfile

      - name: Prepare build environment
        run: touch .env.local

      - name: Build editor Landrush routes
        run: bun run build --filter landrush

      - name: Checkout Landrush site
        uses: actions/checkout@v4
        with:
          repository: Niutels/landrush-site
          ref: main
          path: landrush-site
          token: ${{ secrets.LANDRUSH_SITE_PUSH_TOKEN }}

      - name: Guard production ancestry
        shell: bash
        run: |
          set -euo pipefail

          site="landrush-site"
          mapfile -t production_sources < <(
            git -C "$site" log -1 --pretty=%B |
              sed -nE 's/^Source: Niutels\/editor@([0-9a-f]{40})$/\1/p'
          )
          if [ "${#production_sources[@]}" -ne 1 ]; then
            echo "Expected exactly one anchored Niutels/editor Source trailer on landrush-site/main." >&2
            exit 1
          fi
          production_source="${production_sources[0]}"
          git merge-base --is-ancestor "$production_source" "$GITHUB_SHA"

      - name: Refresh Landrush static bundle
        shell: bash
        run: |
          set -euo pipefail

          site="landrush-site"

          rm -rf \
            "$site/_next" \
            "$site/audios" \
            "$site/demos" \
            "$site/fonts" \
            "$site/hdri" \
            "$site/icons" \
            "$site/items" \
            "$site/landrush-lab" \
            "$site/material" \
            "$site/navigation"
          find "$site" -maxdepth 1 -type f -name '*.svg' -delete
          mkdir -p "$site/_next"

          cp -R apps/landrush/.next/static "$site/_next/static"
          for asset_dir in audios demos fonts hdri icons items landrush-lab material navigation; do
            cp -R "apps/landrush/public/$asset_dir" "$site/$asset_dir"
          done
          cp apps/landrush/public/*.svg "$site/"
          cp apps/landrush/app/favicon.ico "$site/favicon.ico"

          for route in pascal-multiplayer-island pascal-multiplayer-island-water-debug; do
            mkdir -p "$site/landrush-lab/$route"
            cp "apps/landrush/.next/server/app/landrush-lab/$route.html" "$site/landrush-lab/$route/index.html"
          done

          mkdir -p "$site/_release"
          printf '%s\n' \
            "{\"sourceRepository\":\"Niutels/editor\",\"sourceSha\":\"${GITHUB_SHA}\",\"workflowRunId\":\"${GITHUB_RUN_ID}\",\"workflowRunAttempt\":\"${GITHUB_RUN_ATTEMPT}\"}" \
            > "$site/_release/landrush.json"

      - name: Validate Landrush site
        working-directory: landrush-site
        run: |
          npm run check
          npm run build
          test -f dist/_release/landrush.json
          cmp _release/landrush.json dist/_release/landrush.json

      - name: Commit and push Landrush site
        working-directory: landrush-site
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "Publish Landrush from editor ${GITHUB_SHA::7}" \
            -m "Source: Niutels/editor@${GITHUB_SHA}" \
            -m "Workflow-Run: Niutels/editor@${GITHUB_RUN_ID}"
          git push origin main
