<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pascal Multiplayer Island</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      iframe {
        position: relative;
        z-index: 1;
        display: block;
        width: 100vw;
        height: 100vh;
        border: 0;
        background: #fff;
      }

      [data-landrush-shell-loading] {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        color: #fff;
        background: #171717;
        opacity: 1;
        transition: opacity 150ms ease-out;
      }

      [data-landrush-shell-loading][data-hidden] {
        pointer-events: none;
        opacity: 0;
      }

      .loading-content {
        width: 50vw;
        max-width: 760px;
      }

      .loading-labels {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 14px;
        color: #fff;
      }

      .loading-label {
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .loading-percent {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }

      .loading-track {
        height: 12px;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 9999px;
        background: rgb(2 6 23 / 70%);
        box-shadow: 0 18px 60px rgb(0 0 0 / 35%);
      }

      .loading-fill {
        width: 2px;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(to right, #fde68a, #d9f99d, #bae6fd);
      }

    </style>
  </head>
  <body>
    <div
      aria-label="Loading"
      aria-valuemax="100"
      aria-valuemin="0"
      aria-valuenow="0"
      data-landrush-shell-loading
      role="progressbar"
    >
      <div class="loading-content">
        <div class="loading-labels">
          <span class="loading-label">Loading</span>
          <span class="loading-percent">0%</span>
        </div>
        <div class="loading-track"><div class="loading-fill"></div></div>
      </div>
    </div>
    <iframe
      allow="autoplay; fullscreen; gamepad"
      credentialless
      data-landrush-full-scene-frame
      title="Complete isolated Landrush scene"
    ></iframe>
    <script>
      (() => {
        const frame = document.querySelector('[data-landrush-full-scene-frame]')
        const loading = document.querySelector('[data-landrush-shell-loading]')
        const params = new URLSearchParams(location.search)
        const port = location.port || '3002'
        const innerOrigin = `http://localhost:${port}`
        const runtime = new URL(
          '/landrush-lab/pascal-openworld-integration-full-scene',
          innerOrigin,
        )

        params.set('cell', 'combined')
        params.set('run', '1')
        params.set('offline', '1')
        params.set('integrationSidecar', '1')
        params.set('landrushProbe', '1')
        params.set('landrushProbeDom', '1')
        params.set('embedded', '1')
        params.delete('clean')
        params.delete('rendererBackend')
        if (params.get('post') === '1') params.set('benchPostFx', '1')
        else params.delete('benchPostFx')
        runtime.search = params.toString()
        window.addEventListener('message', (event) => {
          if (event.source !== frame.contentWindow) return
          if (event.data?.type !== 'landrush:runtime-painted') return
          loading.dataset.hidden = ''
          loading.addEventListener('transitionend', () => loading.remove(), { once: true })
        })
        frame.src = runtime.toString()

      })()
    </script>
  </body>
</html>
