services:
  - type: web
    name: landrush-world-multiplayer
    runtime: node
    plan: free
    rootDir: apps/landrush-world-multiplayer-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: LANDRUSH_WORLD_MULTIPLAYER_CORS_ORIGIN
        value: "*"
      - key: LANDRUSH_WORLD_MULTIPLAYER_STATE_FILE
        value: "off"
